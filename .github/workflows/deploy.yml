name: Prepare and deploy Admin app release

# No push-triggered deploy: a release must be reviewed with its content package.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      deploy:
        description: Deploy the built image after release preflight approval
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      IMAGE_REPOSITORY: ${{ vars.DOCKER_IMAGE_REPOSITORY }}
      APPROVED_RELEASE_SHA: ${{ vars.APPROVED_RELEASE_SHA }}
      REQUEST_DEPLOY: ${{ inputs.deploy }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_STUDENT_APP_URL: ${{ vars.VITE_STUDENT_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release configuration
        shell: bash
        run: |
          test -n "$IMAGE_REPOSITORY" || { echo 'Set DOCKER_IMAGE_REPOSITORY in this GitHub environment'; exit 1; }
          test -n "$VITE_API_URL" || { echo "Set VITE_API_URL in this GitHub environment"; exit 1; }
          test -n "$VITE_STUDENT_APP_URL" || { echo "Set VITE_STUDENT_APP_URL in this GitHub environment"; exit 1; }
          if [ "$REQUEST_DEPLOY" = "true" ] && [ "$APPROVED_RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo 'Deploy blocked: approve this commit SHA only after backup, migration, media and content preflight'
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push reviewed image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_STUDENT_APP_URL=${{ vars.VITE_STUDENT_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record exact image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE_REPOSITORY@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy reviewed image to CapRover
        if: ${{ inputs.deploy }}
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.CAPROVER_APP }}
          token: ${{ secrets.CAPROVER_TOKEN }}
          image: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
